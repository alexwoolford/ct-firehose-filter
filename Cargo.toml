[package]
name = "ct-firehose-filter"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Edge filter for the Certificate Transparency firehose: drop noise in RAM, trickle matches out."
license = "MIT"
publish = false

[[bin]]
name = "ct-firehose-filter"
path = "src/main.rs"

[dependencies]
addr = "0.15"
aho-corasick = "1"
arc-swap = "1"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_borrow = { version = "0.8", features = ["cowkeys"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

# AWS stack pinned to rustc 1.91.1-compatible releases (newer lines require 1.94).
aws-config = { version = "=1.8.18", features = ["behavior-version-latest"] }
aws-sdk-sqs = "=1.102.0"
aws-credential-types = "=1.2.14"
aws-runtime = "=1.7.5"
aws-sdk-signin = "=1.14.0"
aws-sdk-sso = "=1.102.0"
aws-sdk-ssooidc = "=1.104.0"
aws-sdk-sts = "=1.107.0"
aws-sigv4 = "=1.4.5"
aws-smithy-async = "=1.2.14"
aws-smithy-http = "=0.63.6"
aws-smithy-json = "=0.62.7"
aws-smithy-observability = "=0.2.6"
aws-smithy-runtime = "=1.11.3"
aws-smithy-runtime-api = "=1.12.3"
aws-smithy-runtime-api-macros = "=1.0.0"
aws-smithy-schema = "=0.1.0"
aws-smithy-types = "=1.5.0"
aws-types = "=1.3.16"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
aws-sdk-sqs = { version = "=1.102.0", features = ["test-util"] }
aws-smithy-http-client = "=1.1.13"
aws-smithy-mocks = "=0.2.6"
aws-smithy-protocol-test = "=0.63.14"
futures-util = "0.3"
pretty_assertions = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "ct_firehose_filter"
path = "src/lib.rs"

[lints.rust]
non_ascii_idents = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
clone_on_copy = "deny"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

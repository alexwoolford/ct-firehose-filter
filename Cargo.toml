[package]
name = "ct-firehose-filter"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Edge filter for the Certificate Transparency firehose: drop noise in RAM, trickle matches out."
license = "MIT"
publish = false

[[bin]]
name = "ct-firehose-filter"
path = "src/main.rs"

[dependencies]
addr = "0.15"
aho-corasick = "1"
arc-swap = "1"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_borrow = { version = "0.8", features = ["cowkeys"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha2 = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
futures-util = "0.3"
pretty_assertions = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "ct_firehose_filter"
path = "src/lib.rs"

[lints.rust]
non_ascii_idents = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
clone_on_copy = "deny"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

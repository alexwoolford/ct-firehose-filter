# Production overlay: in-process A′ novelty → rotated alerts.jsonl (Oracle VM only).
#
# Preferred (see docs/DEPLOY.md):
#   cp .env.prod.example .env.prod   # set WATCHLIST_HOST_PATH (≥100k); NOVELTY_REQUIRE_DB / budget via env
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up --build -d
# NOVELTY_DB / NOVELTY_ALERTS are hardcoded below; only REQUIRE_DB, WATCHLIST_MIN_LEN, and budget vars interpolate.
#
# Never use EGRESS=stdout here — raw match JSONL will fill the disk.
#
# Log rotation is defined in docker-compose.yml (10m x 3) and repeated below so a
# prod-only skim still shows the disk cap. CertStream remains chatty upstream
# (no quiet mode — https://github.com/d-Rickyy-b/certstream-server-go/issues/73);
# rotation bounds disk. Filter stays quiet with RUST_LOG=warn.

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  certstream:
    logging: *prod-logging
  filter:
    logging: *prod-logging
    # Named volumes are root-owned; run as root so SQLite can create novelty.db
    # (same pattern as certstream sidecar). Prefer host bind-mount + ctfilter uid in systemd.
    user: "0:0"
    environment:
      EGRESS: novelty
      RUST_LOG: warn
      PROGRESS_INTERVAL_SECS: "300"
      # Refuse demo keywords.txt under prod egress (override with WATCHLIST_MIN_LEN=0 only for smoke).
      WATCHLIST_MIN_LEN: ${WATCHLIST_MIN_LEN:-100000}
      NOVELTY_DB: /var/lib/ct-firehose-filter/novelty.db
      NOVELTY_ALERTS: /var/lib/ct-firehose-filter/alerts.jsonl
      # First boot: leave 0 to create DB; then flip to 1 once healthy.
      NOVELTY_REQUIRE_DB: ${NOVELTY_REQUIRE_DB:-0}
      NOVELTY_TIERS: A
      NOVELTY_MAX_COALITION: ${NOVELTY_MAX_COALITION:-5}
      # Chunk + total budget (multi-year headroom on ~200GB boot volume).
      NOVELTY_ALERTS_MAX_BYTES: ${NOVELTY_ALERTS_MAX_BYTES:-268435456}
      NOVELTY_ALERTS_MAX_TOTAL_BYTES: ${NOVELTY_ALERTS_MAX_TOTAL_BYTES:-21474836480}
      NOVELTY_ALERTS_GZIP: ${NOVELTY_ALERTS_GZIP:-1}
    volumes:
      - novelty-data:/var/lib/ct-firehose-filter

volumes:
  novelty-data:

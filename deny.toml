[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive aws-smithy-http-client → rustls 0.21 → rustls-webpki 0.101.7 (SDK pinned for rustc 1.91).
# CertStream ingress uses rustls-webpki ≥0.103 via tokio-tungstenite. SQS path does not parse
# untrusted CRLs via the affected APIs. Drop ignores when AWS rustls line upgrades.
ignore = [
    { id = "RUSTSEC-2026-0104", reason = "transitive AWS rustls 0.21 webpki; CRL panic N/A to SQS client" },
    { id = "RUSTSEC-2026-0098", reason = "transitive AWS rustls 0.21 webpki; URI name constraints" },
    { id = "RUSTSEC-2026-0099", reason = "transitive AWS rustls 0.21 webpki; wildcard name constraints" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
